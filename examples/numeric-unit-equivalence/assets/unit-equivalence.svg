<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1140" viewBox="0 0 640 1140" role="img" aria-labelledby="title desc">
<title id="title">Synthetic A versus nA unit-equivalence check</title>
<desc id="desc">Paired group mean absolute errors for Dummy, Ridge and ExtraTrees, without scaling and with the existing Calculator train-only scaling. Prediction gaps are compared with a training-derived tolerance below the plots. Raw Ridge also changes regularization under fixed alpha. This is an artificial software fixture, not a real-device accuracy claim.</desc>
<rect width="640" height="1140" fill="#fffdf6"/>
<g font-family="Arial, Helvetica, sans-serif">
