<text x="32" y="78" font-size="30" font-weight="700" fill="#223d35">Same inputs. Different units.</text>
<text x="32" y="111" font-size="20" font-weight="400" fill="#223d35">A versus nA · no real-device benchmark</text>
<text x="32" y="143" font-size="18" font-weight="400" fill="#223d35">Group MAE · arbitrary response units · lower is better</text>
