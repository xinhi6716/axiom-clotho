[package]
name = "clotho-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
publish = false

[[bin]]
name = "clotho"
path = "src/main.rs"

[dependencies]
clotho-core = { path = "../clotho-core" }
csv = "=1.3.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["float_roundtrip"] }
# Keep the declared Rust 1.70 minimum reproducible rather than drifting transitively.
ryu = "=1.0.20"
itoa = "=1.0.15"
memchr = "=2.7.4"

[dev-dependencies]
# Constrain derive-macro transitive versions to the supported MSRV as well.
syn = "=2.0.101"
quote = "=1.0.40"
proc-macro2 = "=1.0.95"
unicode-ident = "=1.0.18"
