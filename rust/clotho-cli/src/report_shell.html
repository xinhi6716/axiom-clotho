<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width, initial-scale=1'><meta http-equiv=Content-Security-Policy content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; script-src 'none'; base-uri 'none'; form-action 'none'"><title>Clotho · Results workspace</title><style>
:root{color-scheme:light dark;--bg:#f4f5f7;--surface:#fff;--ink:#182329;--muted:#52616b;--line:#d8dfe5;--accent:#08796f;--wash:#e9f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}header,main,footer,nav{max-width:1180px;margin:auto;padding:24px 32px}header{padding-top:48px}h1{font-size:clamp(28px,4vw,44px);line-height:1.15;margin:12px 0}h2{font-size:25px}h3{font-size:17px}.eyebrow{letter-spacing:.14em;font-size:12px;font-weight:750;color:var(--accent)}nav{display:flex;gap:8px;flex-wrap:wrap;padding-top:0;padding-bottom:0}nav a{padding:9px 16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;color:var(--ink);text-decoration:none}a:hover{background:var(--wash)}a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}section{scroll-margin-top:20px;margin-bottom:36px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.card p{margin:0;color:var(--muted)}.card strong{display:block;font-size:28px;overflow-wrap:anywhere}.notice{padding:16px 20px;background:var(--wash);border-left:4px solid var(--accent);border-radius:8px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}table{border-collapse:collapse;background:var(--surface);width:100%;margin-bottom:16px;font-size:14px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere}th{font-weight:600}details{margin:12px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}summary{cursor:pointer;font-weight:650}details[open] summary{margin-bottom:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.scroll{overflow:auto;max-height:420px}figure{margin:0;background:var(--surface);padding:24px;border:1px solid var(--line);border-radius:16px}svg{width:100%;max-height:440px}svg text{fill:var(--muted);font-size:13px}circle{fill:var(--accent);opacity:.5}.axis{fill:none;stroke:var(--muted)}.reference{stroke:var(--muted);stroke-dasharray:5;fill:none}figcaption,footer{font-size:13px;color:var(--muted)}.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:8px;background:var(--surface);padding:8px}@media(prefers-color-scheme:dark){:root{--bg:#11191e;--surface:#1b272e;--ink:#edf2f5;--muted:#b8c6cd;--line:#3a4b56;--accent:#75dbc7;--wash:#183e37}}@media(max-width:700px){header,main,footer,nav{padding-left:16px;padding-right:16px}.cards{grid-template-columns:1fr 1fr}.columns{grid-template-columns:1fr}th,td{padding:8px;font-size:12px}}@media print{nav,.skip{display:none}body{background:white;color:black}details{break-inside:avoid}section{break-inside:auto}.cards{grid-template-columns:repeat(4,1fr)}}
</style></head><body><a class=skip href=#main>Skip to results</a>
