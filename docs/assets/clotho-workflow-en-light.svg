<rect x="902" y="116" width="266" height="214" rx="8" fill="#faf7ef" stroke="#d1be92"/>
<text x="922" y="152" fill="#7e5c22" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">04</text>
<g transform="translate(1125 153)" fill="none" stroke="#7e5c22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-20 18V-18H7L20-5V18ZM7-18V-5H20M-11 5L-3 12L11-1"/></g>
<text x="922" y="211" fill="#14212b" font-size="32" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">Score</text>
<text x="922" y="260" fill="#14212b" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Match IDs to outcomes</text>
<text x="922" y="294" fill="#625e53" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Score without refitting</text>
<path d="M1035 367V331M1028 339L1035 331L1042 339" fill="none" stroke="#7e5c22" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="32" y="367" width="1136" height="62" rx="8" fill="#faf7ef" stroke="#d1be92"/>
<text x="52" y="405" fill="#7e5c22" font-size="18" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">LATER OUTCOMES</text>
<text x="375" y="405" fill="#625e53" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Join later labels only at Score. No new fits.</text>
