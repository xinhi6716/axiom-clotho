<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="454" viewBox="0 0 1200 454" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From measurements to predictions</title>
<desc id="desc">Prepare device features and training targets, inspect the plan, fit and predict, then score later outcomes without refitting.</desc>
<rect width="1200" height="454" rx="12" fill="#f4f0e5"/>
<path d="M24 1H1176M24 453H1176" stroke="#d1be92"/>
<text x="32" y="42" fill="#7e5c22" font-size="16" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="3">THE MEASUREMENT THREAD</text>
<text x="32" y="84" fill="#14212b" font-size="30" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">From measurements to predictions</text>
<path d="M1050 43H1158M1104 30V56" stroke="#a2854e"/>
<path d="M1104 34L1113 43L1104 52L1095 43Z" fill="#f4f0e5" stroke="#7e5c22"/>
<rect x="32" y="116" width="266" height="214" rx="8" fill="#faf7ef" stroke="#d1be92"/>
<text x="52" y="152" fill="#7e5c22" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">01</text>
<g transform="translate(255 153)" fill="none" stroke="#7e5c22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-20 12V-12M0 18V-18M20 12V-12"/><circle cx="-20" cy="0" r="4"/><circle cx="0" cy="-8" r="4"/><circle cx="20" cy="6" r="4"/></g>
<text x="52" y="211" fill="#14212b" font-size="32" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">Prepare</text>
<text x="52" y="260" fill="#14212b" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Features + exact IDs</text>
<text x="52" y="294" fill="#625e53" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Training targets only</text>
<path d="M299 223H319M314 218L319 223L314 228" fill="none" stroke="#a2854e" stroke-linecap="round"/>
<rect x="322" y="116" width="266" height="214" rx="8" fill="#faf7ef" stroke="#d1be92"/>
<text x="342" y="152" fill="#7e5c22" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">02</text>
<g transform="translate(545 153)" fill="none" stroke="#7e5c22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-20-16H20V16H-20ZM-7-16V16M7-16V16M-20-5H20M-20 5H20"/></g>
<text x="342" y="211" fill="#14212b" font-size="32" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">Plan</text>
<text x="342" y="260" fill="#14212b" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Declared splits</text>
<text x="342" y="294" fill="#625e53" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Inspect the fit budget</text>
<path d="M589 223H609M604 218L609 223L604 228" fill="none" stroke="#a2854e" stroke-linecap="round"/>
<rect x="612" y="116" width="266" height="214" rx="8" fill="#faf7ef" stroke="#d1be92"/>
<text x="632" y="152" fill="#7e5c22" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">03</text>
<g transform="translate(835 153)" fill="none" stroke="#7e5c22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M0-23V23M-15-15C24-15-24 15 15 15M15-15C-24-15 24 15-15 15"/><path d="M-6-23H6M-6 23H6"/></g>
<text x="632" y="211" fill="#14212b" font-size="32" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">Run</text>
<text x="632" y="260" fill="#14212b" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Compare + refit</text>
<text x="632" y="294" fill="#625e53" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Target-free prediction</text>
<path d="M879 223H899M894 218L899 223L894 228" fill="none" stroke="#a2854e" stroke-linecap="round"/>
<rect x="902" y="116" width="266" height="214" rx="8" fill="#faf7ef" stroke="#d1be92"/>
<text x="922" y="152" fill="#7e5c22" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">04</text>
<g transform="translate(1125 153)" fill="none" stroke="#7e5c22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-20 18V-18H7L20-5V18ZM7-18V-5H20M-11 5L-3 12L11-1"/></g>
<text x="922" y="211" fill="#14212b" font-size="32" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">Score</text>
<text x="922" y="260" fill="#14212b" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Join later outcomes</text>
<text x="922" y="294" fill="#625e53" font-size="20" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">No new model fits</text>
<path d="M32 360H1168" stroke="#d1be92"/>
<text x="32" y="394" fill="#7e5c22" font-size="18" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">LATER OUTCOMES → SCORE ONLY</text>
<text x="32" y="427" fill="#625e53" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">No future outcomes enter preparation or modeling.</text>
<path d="M1134 425V381L1127 388M1134 381L1141 388" fill="none" stroke="#a2854e" stroke-width="1.5"/>
</svg>
