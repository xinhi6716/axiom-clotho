<svg xmlns="http://www.w3.org/2000/svg" width="480" height="906" viewBox="0 0 480 906" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From measurements to predictions</title>
<desc id="desc">Prepare device features and training targets, inspect the plan, fit and predict, then score later outcomes without refitting.</desc>
<rect width="480" height="906" rx="12" fill="#111923"/>
<path d="M24 1H456M24 905H456" stroke="#5d543e"/>
<text x="24" y="38" fill="#dfbd7a" font-size="15" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="2">THE MEASUREMENT THREAD</text>
<text x="24" y="76" fill="#f3eddf" font-size="25" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">From measurements to predictions</text>
<path d="M60 242V264" stroke="#a78d59"/>
<rect x="24" y="104" width="432" height="140" rx="8" fill="#18222e" stroke="#5d543e"/>
<circle cx="60" cy="143" r="20" fill="#111923" stroke="#5d543e"/>
<text x="60" y="149" fill="#dfbd7a" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0">01</text>
<text x="100" y="147" fill="#f3eddf" font-size="28" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">Prepare</text>
<g transform="translate(418 143)" fill="none" stroke="#dfbd7a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-20 12V-12M0 18V-18M20 12V-12"/><circle cx="-20" cy="0" r="4"/><circle cx="0" cy="-8" r="4"/><circle cx="20" cy="6" r="4"/></g>
<text x="100" y="186" fill="#f3eddf" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Features + exact IDs</text>
<text x="100" y="218" fill="#c2bba9" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Training targets only</text>
<path d="M60 402V424" stroke="#a78d59"/>
<rect x="24" y="264" width="432" height="140" rx="8" fill="#18222e" stroke="#5d543e"/>
<circle cx="60" cy="303" r="20" fill="#111923" stroke="#5d543e"/>
<text x="60" y="309" fill="#dfbd7a" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0">02</text>
<text x="100" y="307" fill="#f3eddf" font-size="28" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">Plan</text>
<g transform="translate(418 303)" fill="none" stroke="#dfbd7a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-20-16H20V16H-20ZM-7-16V16M7-16V16M-20-5H20M-20 5H20"/></g>
<text x="100" y="346" fill="#f3eddf" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Declared splits</text>
<text x="100" y="378" fill="#c2bba9" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Inspect the fit budget</text>
<path d="M60 562V584" stroke="#a78d59"/>
<rect x="24" y="424" width="432" height="140" rx="8" fill="#18222e" stroke="#5d543e"/>
<circle cx="60" cy="463" r="20" fill="#111923" stroke="#5d543e"/>
<text x="60" y="469" fill="#dfbd7a" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0">03</text>
<text x="100" y="467" fill="#f3eddf" font-size="28" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">Run</text>
<g transform="translate(418 463)" fill="none" stroke="#dfbd7a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M0-23V23M-15-15C24-15-24 15 15 15M15-15C-24-15 24 15-15 15"/><path d="M-6-23H6M-6 23H6"/></g>
<text x="100" y="506" fill="#f3eddf" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Compare + refit</text>
<text x="100" y="538" fill="#c2bba9" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Target-free prediction</text>
<rect x="24" y="584" width="432" height="140" rx="8" fill="#18222e" stroke="#5d543e"/>
<circle cx="60" cy="623" r="20" fill="#111923" stroke="#5d543e"/>
<text x="60" y="629" fill="#dfbd7a" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0">04</text>
<text x="100" y="627" fill="#f3eddf" font-size="28" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">Score</text>
<g transform="translate(418 623)" fill="none" stroke="#dfbd7a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-20 18V-18H7L20-5V18ZM7-18V-5H20M-11 5L-3 12L11-1"/></g>
<text x="100" y="666" fill="#f3eddf" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">Join later outcomes</text>
<text x="100" y="698" fill="#c2bba9" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">No new model fits</text>
<path d="M24 765H456" stroke="#5d543e"/>
<text x="24" y="798" fill="#dfbd7a" font-size="18" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">LATER OUTCOMES → SCORE ONLY</text>
<text x="24" y="838" fill="#c2bba9" font-size="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">No future outcomes enter</text>
<text x="24" y="870" fill="#c2bba9" font-size="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">preparation or modeling.</text>
</svg>
