<circle cx="60" cy="463" r="20" fill="#f4f0e5" stroke="#d1be92"/>
<text x="60" y="469" fill="#7e5c22" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0">03</text>
<text x="100" y="467" fill="#14212b" font-size="28" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">執行</text>
