<text x="60" y="629" fill="#7e5c22" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0">04</text>
<text x="100" y="627" fill="#14212b" font-size="28" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">評分</text>
