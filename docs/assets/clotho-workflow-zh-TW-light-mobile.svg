<circle cx="60" cy="303" r="20" fill="#f4f0e5" stroke="#d1be92"/>
<text x="60" y="309" fill="#7e5c22" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0">02</text>
<text x="100" y="307" fill="#14212b" font-size="28" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">規劃</text>
<g transform="translate(418 303)" fill="none" stroke="#7e5c22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M-20-16H20V16H-20ZM-7-16V16M7-16V16M-20-5H20M-20 5H20"/></g>
<text x="100" y="346" fill="#14212b" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">宣告群組切分</text>
<text x="100" y="378" fill="#625e53" font-size="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">檢查擬合次數預算</text>
<text x="171" y="305" fill="#7e5c22" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">plan</text>
