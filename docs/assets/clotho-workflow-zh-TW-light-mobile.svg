<svg xmlns="http://www.w3.org/2000/svg" width="480" height="906" viewBox="0 0 480 906" role="img" aria-labelledby="title desc" xml:lang="zh-TW">
<title id="title">從量測到預測</title>
<desc id="desc">整理元件特徵與訓練端點、檢查計畫、擬合並預測，最後以日後觀測值計分，不重新擬合。</desc>
<rect width="480" height="906" rx="12" fill="#f4f0e5"/>
<path d="M24 1H456M24 905H456" stroke="#d1be92"/>
<text x="24" y="38" fill="#7e5c22" font-size="15" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="2">量 測 之 線</text>
<text x="24" y="76" fill="#14212b" font-size="25" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" letter-spacing="0">從量測到預測</text>
<path d="M60 242V264" stroke="#a2854e"/>
