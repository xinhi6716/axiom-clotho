<path d="M24 765H456" stroke="#d1be92"/>
<text x="24" y="798" fill="#7e5c22" font-size="18" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" text-anchor="start" letter-spacing="0">日後觀測值 → 僅供評分</text>
<text x="24" y="838" fill="#625e53" font-size="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">未來觀測值不進入</text>
<text x="24" y="870" fill="#625e53" font-size="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" letter-spacing="0">資料準備或建模。</text>
