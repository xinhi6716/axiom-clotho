<text x="448" y="215" fill="#ffffff" font-size="26" font-weight="600">Compare</text>
<text x="448" y="252" fill="#c7d3e0" font-size="17">Keep test groups separate</text>
<path d="M785 207h14m-6-6 6 6-6 6" fill="none" stroke="#66d8bd" stroke-width="2"/>
