<path d="M32 0H1168" stroke="#54cab0" stroke-width="5"/>
<g font-family="DejaVu Sans, Noto Sans CJK TC, sans-serif">
<text x="42" y="57" fill="#66d8bd" font-size="17" letter-spacing="2">GROUPBENCH / ML SUPER CALCULATOR</text>
<text x="42" y="105" fill="#f4f5f7" font-size="30" font-weight="600">A local workflow for grouped data</text>
<rect x="42" y="143" width="348" height="141" rx="12" fill="#1b2d40" stroke="#3a5068"/>
<text x="64" y="179" fill="#66d8bd" font-size="16">01</text>
<text x="64" y="215" fill="#ffffff" font-size="26" font-weight="600">Prepare</text>
<text x="64" y="252" fill="#c7d3e0" font-size="17">CSV + target + groups</text>
