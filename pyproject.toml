[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-super-calculator"
version = "0.2.0a3"
description = "Local-first ML Super Calculator: grouped regression and explicit binary classification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GroupBench contributors"}]
keywords = ["machine-learning", "materials", "regression", "binary-classification", "group-cross-validation", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.4,<2", "threadpoolctl>=3,<4"]

[project.scripts]
mlcalc = "groupbench.cli:main"
groupbench = "groupbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
