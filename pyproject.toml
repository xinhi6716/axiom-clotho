[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-super-calculator"
version = "0.3.0b3"
description = "Axiom Clotho: local grouped ML and explicit measurement-to-prediction workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/mlworkflow/_vendor/semiconductor/LICENSE", "src/mlworkflow/_vendor/scorecard/tools/prediction-scorecard/LICENSE"]
authors = [{name = "GroupBench contributors"}]
keywords = ["machine-learning", "materials", "regression", "binary-classification", "group-cross-validation", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.4,<2", "threadpoolctl>=3,<4"]

[project.scripts]
mlcalc = "groupbench.cli:main"
groupbench = "groupbench.cli:main"
mlcalc-workflow = "mlworkflow.cli:main"
clotho = "mlworkflow.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
mlworkflow = ["_vendor/**/*", "_vendor/manifest.json"]
